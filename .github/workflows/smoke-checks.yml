name: Silly Dragon browser checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/smoke/package-lock.json
      - name: Install pinned test dependencies
        run: npm ci --prefix tools/smoke --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: tools/smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: Check calculators and navigation
        run: node tools/smoke/run.cjs
      - name: Save report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silly-dragon-test-report
          path: test-results/smoke/
          if-no-files-found: warn
          retention-days: 14
